# Public datasets used by SteelVision.
# Class names are normalized: lowercase, spaces/hyphens -> underscores.
# Run `python -m steelvision.data.prepare --datasets <name>` to fetch + convert + split.

seed: 42

splits:
  train: 0.7
  val: 0.15
  test: 0.15

dedup:
  hash_size: 16
  max_distance: 8

datasets:
  neu_det:
    kaggle: kaustubhdikshit/neu-surface-defect-database
    classes: [crazing, inclusion, patches, pitted_surface, rolled_in_scale, scratches]

  gc10:
    kaggle: alex000kim/gc10det
    classes:
      [punching, weld_line, crescent_gap, water_spot, oil_spot, silk_spot, inclusion, rolled_pit, crease, waist_folding]

  mvtec_ad:
    type: anomaly
    kaggle: ipythonx/mvtec-ad
    category: metal_nut
    note: >-
      Download-only here; PatchCore (Phase 3) consumes MVTec AD categories
      directly through anomalib.
