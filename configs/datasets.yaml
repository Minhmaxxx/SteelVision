# Public datasets used by SteelVision.
# Class names are normalized: lowercase, spaces/hyphens -> underscores.
# Run `python -m steelvision.data.prepare --datasets <name>` to fetch + convert + split.

seed: 42

splits:
  train: 0.7
  val: 0.15
  test: 0.15

dedup:
  hash_size: 16
  max_distance: 8

datasets:
  neu_det:
    kaggle: kaustubhdikshit/neu-surface-defect-database
    classes: [crazing, inclusion, patches, pitted_surface, rolled_in_scale, scratches]

  gc10:
    kaggle: alex000kim/gc10det
    classes:
      [punching, weld_line, crescent_gap, water_spot, oil_spot, silk_spot, inclusion, rolled_pit, crease, waist_folding]
    # The Kaggle mirror labels defects with Chinese pinyin; canonical English
    # names follow the GC10-DET paper (Lv et al., 2020). Both 10_yaozhe and
    # 10_yaozhed are waist folding (naming inconsistency in the source data).
    rename:
      1_chongkong: punching
      2_hanfeng: weld_line
      3_yueyawan: crescent_gap
      4_shuiban: water_spot
      5_youban: oil_spot
      6_siban: silk_spot
      7_yiwu: inclusion
      8_yahen: rolled_pit
      9_zhehen: crease
      10_yaozhe: waist_folding
      10_yaozhed: waist_folding
    ignore: [d]

  mvtec_ad:
    type: anomaly
    kaggle: ipythonx/mvtec-ad
    category: metal_nut
    note: >-
      Download-only here; PatchCore (Phase 3) consumes MVTec AD categories
      directly through anomalib.
